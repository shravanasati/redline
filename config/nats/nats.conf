# JetStream
jetstream {
  store_dir: /data
}

# Server-level ping/pong tuning
# Clients that miss 3 consecutive pongs are considered dead and disconnected.
ping_interval: "30s"

# HTTP monitoring (healthcheck + /varz, /connz, etc.)
http_port: 8222

# Per-service username/password authorization
authorization {
  users: [
    {
      # control plane — publishes monitor status updates
      user: $NATS_USER_CONTROL_PLANE
      password: $NATS_PASS_CONTROL_PLANE
      permissions {
        publish:   { allow: ["monitors.>"] }
        subscribe: { deny:  [">"]}
      }
    },
    {
      # dispatcher service (Go) — publishes tasks to JetStream, subscribes to monitor updates
      user: $NATS_USER_DISPATCHER
      password: $NATS_PASS_DISPATCHER
      permissions {
        publish:   { allow: ["tasks.>", "$JS.API.>", "_INBOX.>", "$KV.>"] }
        subscribe: { allow: ["monitors.>", "_INBOX.>", "$KV.>", "$JS.>"] }
      }
    },
    {
      # alerting service (Python) — consumes results stream, sends emergency vouch requests
      user: $NATS_USER_ALERTING
      password: $NATS_PASS_ALERTING
      permissions {
        publish:   { allow: ["emergency_vouches", "_INBOX.>", "$JS.ACK.RESULTS.>"] }
        subscribe: { allow: ["results.>", "_INBOX.>", "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.>"] }
      }
    },
    {
      # worker service (Go) — pulls tasks from JetStream, publishes results, replies to emergency vouches
      user: $NATS_USER_WORKER
      password: $NATS_PASS_WORKER
      permissions {
        publish:   { allow: ["results.>", "$JS.API.>", "_INBOX.>", "$JS.ACK.TASKS.>", "$KV.>"] }
        subscribe: { allow: ["emergency_vouches", "_INBOX.>"] }
      }
    },
    {
      # CLI / admin — unrestricted, for local dev and debugging only
      user: $NATS_USER_CLI
      password: $NATS_PASS_CLI
    }
  ]
}
