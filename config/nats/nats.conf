# JetStream
jetstream {
  store_dir: /data
}

# HTTP monitoring (healthcheck + /varz, /connz, etc.)
http_port: 8222

# Per-service username/password authorization
authorization {
  users: [
    {
      # control plane — publishes monitor status updates
      user: $NATS_USER_CONTROL_PLANE
      password: $NATS_PASS_CONTROL_PLANE
      permissions {
        publish:   { allow: ["monitor_updates"] }
        subscribe: { deny: [">"] }
      }
    },
    {
      # dispatcher service (Go) — publishes tasks, subscribes to monitor updates
      user: $NATS_USER_DISPATCHER
      password: $NATS_PASS_DISPATCHER
      permissions {
        publish:   { allow: ["tasks.>"] }
        subscribe: { allow: ["monitor_updates"] }
      }
    },
    {
      # alerting service (Python) — subscribes to results stream, sends emergency vouch requests
      user: $NATS_USER_ALERTING
      password: $NATS_PASS_ALERTING
      permissions {
        publish:   { allow: ["emergency_vouches", "_INBOX.>"] }
        subscribe: { allow: ["results.>", "_INBOX.>", "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.>"] }
      }
    },
    {
      # worker service (Go) — processes tasks, replies to emergency vouch requests
      user: $NATS_USER_WORKER
      password: $NATS_PASS_WORKER
      permissions {
        publish:   { allow: ["_INBOX.>"] }
        subscribe: { allow: ["tasks.>", "emergency_vouches"] }
      }
    },
    {
      # CLI / admin — unrestricted, for local dev and debugging only
      user: $NATS_USER_CLI
      password: $NATS_PASS_CLI
    }
  ]
}
