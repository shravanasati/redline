version: v2
managed:
  enabled: false
  override:
    - file_option: go_package_prefix
      value: github.com/shravanasati/redline/services/shared/pb

plugins:
  # - remote: buf.build/protocolbuffers/go
  - local: protoc-gen-go
    out: services/shared/pb
    opt: paths=source_relative

  # - remote: buf.build/protocolbuffers/python
  - protoc_builtin: python
    out: services/pit-wall/pb
    types:
      - "tasks.MonitorTaskResult"

  - local: protoc-gen-es
    out: apps/paddock/lib/pb
    opt: target=ts
    types:
      - "monitors.MonitorEvent"

inputs:
  - directory: proto